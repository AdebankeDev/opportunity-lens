[project]
name = "opportunity-lens-api"
version = "0.1.0"
description = "FastAPI interface to the OpportunityLens scholarship engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "google-genai>=0.8",
  "python-dotenv>=1",
]

[tool.vercel]
entrypoint = "api.index:app"
